name: publish
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only (no Instagram API calls, nothing moved)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: instagram-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish oldest due post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then node scripts/publish.mjs --dry-run --check-urls; else node scripts/publish.mjs; fi
      - name: Commit result
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -n "$(git status --porcelain posted queue)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A posted queue
            name=$(git diff --cached --name-only | grep result.json | head -1 | cut -d/ -f2)
            git commit -m "posted: $name"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
